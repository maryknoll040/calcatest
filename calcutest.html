<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Glass Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom glassmorphism styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Custom button press tactile effect */
        .calc-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4 transition-colors duration-500">

    <div class="w-full max-w-sm glass-panel shadow-2xl rounded-3xl p-6 transition-all duration-300">
        
        <!-- Top bar: Theme switcher & Title -->
        <div class="flex justify-between items-center mb-4">
            <span class="text-xs font-semibold tracking-wider text-gray-500 dark:text-gray-400 uppercase">Standard Calc</span>
            <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200/50 dark:hover:bg-gray-700/50 transition-colors text-gray-700 dark:text-gray-200">
                <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </div>

        <!-- Calculator Screen -->
        <div class="bg-gray-100/80 dark:bg-gray-900/80 rounded-2xl p-4 mb-6 text-right shadow-inner flex flex-col justify-end min-h-[100px] border border-gray-200/50 dark:border-gray-800">
            <div id="history" class="text-xs text-gray-500 dark:text-gray-400 font-medium h-5 overflow-x-auto whitespace-nowrap"></div>
            <div id="display" class="text-3xl sm:text-4xl font-bold text-gray-800 dark:text-gray-100 tracking-tight overflow-x-auto whitespace-nowrap">0</div>
        </div>

        <!-- Keypad Grid -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Row 1 -->
            <button onclick="clearAll()" class="calc-btn col-span-2 bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 font-semibold py-3.5 rounded-2xl transition-all">AC</button>
            <button onclick="deleteDigit()" class="calc-btn bg-gray-200/70 dark:bg-gray-800/70 hover:bg-gray-300/70 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-semibold py-3.5 rounded-2xl transition-all">⌫</button>
            <button onclick="appendOperator('/')" class="calc-btn bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 font-bold py-3.5 rounded-2xl transition-all">÷</button>

            <!-- Row 2 -->
            <button onclick="appendNumber('7')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">7</button>
            <button onclick="appendNumber('8')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">8</button>
            <button onclick="appendNumber('9')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">9</button>
            <button onclick="appendOperator('*')" class="calc-btn bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 font-bold py-3.5 rounded-2xl transition-all">×</button>

            <!-- Row 3 -->
            <button onclick="appendNumber('4')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">4</button>
            <button onclick="appendNumber('5')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">5</button>
            <button onclick="appendNumber('6')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">6</button>
            <button onclick="appendOperator('-')" class="calc-btn bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 font-bold py-3.5 rounded-2xl transition-all">-</button>

            <!-- Row 4 -->
            <button onclick="appendNumber('1')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">1</button>
            <button onclick="appendNumber('2')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">2</button>
            <button onclick="appendNumber('3')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">3</button>
            <button onclick="appendOperator('+')" class="calc-btn bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 font-bold py-3.5 rounded-2xl transition-all">+</button>

            <!-- Row 5 -->
            <button onclick="appendNumber('0')" class="calc-btn col-span-2 bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">0</button>
            <button onclick="appendDecimal('.')" class="calc-btn bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-100 font-semibold py-3.5 rounded-2xl transition-all shadow-sm">.</button>
            <button onclick="calculateResult()" class="calc-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-indigo-500/30">=</button>
        </div>

    </div>

    <script>
        let currentInput = '0';
        let historyString = '';
        let resetScreen = false;

        const displayEl = document.getElementById('display');
        const historyEl = document.getElementById('history');

        function updateDisplay() {
            displayEl.textContent = currentInput;
            historyEl.textContent = historyString;
        }

        function appendNumber(num) {
            if (currentInput === '0' || resetScreen) {
                currentInput = num;
                resetScreen = false;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendDecimal(dot) {
            if (resetScreen) {
                currentInput = '0';
                resetScreen = false;
            }
            const parts = currentInput.split(/[\+\-\*\/]/);
            const lastPart = parts[parts.length - 1];
            if (!lastPart.includes('.')) {
                currentInput += dot;
                updateDisplay();
            }
        }

        function appendOperator(op) {
            if (resetScreen) {
                resetScreen = false;
            }
            const lastChar = currentInput.slice(-1);
            if (['+', '-', '*', '/'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + op;
            } else {
                currentInput += op;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            historyString = '';
            resetScreen = false;
            updateDisplay();
        }

        function deleteDigit() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function calculateResult() {
            try {
                // Safe evaluation replacement for standard calc
                let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                historyString = currentInput + ' =';
                
                // Evaluate expression safely using Function wrapper
                let result = Function('"use strict";return (' + sanitized + ')')();
                
                if (!isFinite(result)) {
                    throw new Error("Math Error");
                }
                
                // Format decimal output to avoid floating point anomalies
                currentInput = parseFloat(result.toFixed(8)).toString();
                resetScreen = true;
                updateDisplay();
            } catch (error) {
                currentInput = 'Error';
                resetScreen = true;
                updateDisplay();
            }
        }

        function toggleTheme() {
            const htmlEl = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            } else {
                htmlEl.classList.add('dark');
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>';
            }
        }

        // Optional keyboard support
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9')) appendNumber(e.key);
            if (e.key === '.') appendDecimal('.');
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') appendOperator(e.key);
            if (e.key === 'Enter' || e.key === '=') calculateResult();
            if (e.key === 'Backspace') deleteDigit();
            if (e.key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
